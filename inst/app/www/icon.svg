<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgbwA" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#04201f"/>
