    <!-- circular connecting arrows (petrol accent) -->
    <path d="M 316,214 A 104 104 0 0 1 356,328" fill="none" stroke="#2BB3C0" stroke-width="4.5" marker-end="url(#arrbwA)" opacity="0.9"/>
    <path d="M 344,344 A 106 106 0 0 1 168,348" fill="none" stroke="#2BB3C0" stroke-width="4.5" marker-end="url(#arrbwA)" opacity="0.9"/>
    <path d="M 150,326 A 104 104 0 0 1 188,214" fill="none" stroke="#2BB3C0" stroke-width="4.5" marker-end="url(#arrbwA)" opacity="0.9"/>

    <!-- Sheet 1 — top -->
    <g transform="rotate(-6 250 205)">
      <rect x="196" y="158" width="108" height="90" rx="9" fill="#F5F8FA" stroke="#0A2E2C" stroke-width="2"/>
      <line x1="210" y1="184" x2="290" y2="184" stroke="#22303c" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="210" y1="202" x2="290" y2="202" stroke="#5b6b7a" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="210" y1="220" x2="262" y2="220" stroke="#5b6b7a" stroke-width="4.5" stroke-linecap="round"/>
