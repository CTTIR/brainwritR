    <g transform="rotate(8 330 362)">
      <rect x="276" y="316" width="108" height="90" rx="9" fill="#F5F8FA" stroke="#0A2E2C" stroke-width="2"/>
      <line x1="290" y1="342" x2="370" y2="342" stroke="#22303c" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="290" y1="360" x2="370" y2="360" stroke="#5b6b7a" stroke-width="4.5" stroke-linecap="round"/>
      <line x1="290" y1="378" x2="342" y2="378" stroke="#5b6b7a" stroke-width="4.5" stroke-linecap="round"/>
