    <marker id="arrbwA" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0,1 L 9,5 L 0,9 z" fill="#2BB3C0"/>
    </marker>
    <clipPath id="hexbwA">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgbwA)"/>

  <g clip-path="url(#hexbwA)">

    <!-- faint grid -->
    <line x1="45" y1="200" x2="455" y2="200" stroke="#0d3b3a" stroke-width="0.4" opacity="0.4"/>
    <line x1="45" y1="260" x2="455" y2="260" stroke="#0d3b3a" stroke-width="0.4" opacity="0.4"/>
